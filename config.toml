# Site configuration. This file is about the website; facts about the program live in
# content/home/mod.toml. Zola reads this file; so does CI.

# Where the site lives. On GitHub Pages the workflow substitutes the real Pages URL, so this
# value matters for local previews.
base_url = "https://DreamWeave-MP.github.io/Morrobroom"
title = "Morrobroom"
description = "Build Morrowind levels in TrenchBroom: a brush compiler, lightmapper and NIF-to-TrenchBroom importer for OpenMW."

compile_sass = true
build_search_index = true
generate_feeds = true
feed_filenames = ["atom.xml"]
taxonomies = [{ name = "tags", feed = false }]

[search]
index_format = "fuse_json"
include_title = true
include_description = true
include_content = true
truncate_content_length = 400

[markdown]
highlighting = { theme = "dracula-soft" }
insert_anchor_links = "right"
smart_punctuation = true

[slugify]
paths = "safe"

[link_checker]
skip_prefixes = ["https://github.com/", "https://www.nexusmods.com/"]

[extra]
# The repository that builds and publishes this site. CI refuses to build anywhere else.
github_username = "DreamWeave-MP"
github_project = "Morrobroom"

logo_text = "Morrobroom"
footer_text = "Morrobroom · DreamWeave contributors"
favicon = "img/logo.png"

palette = "umber"

menu_items = [
    { name = "Morrobroom", url = "@/home/index.md" },
    { name = "Start here", url = "@/docs/start-here.md" },
    { name = "Manual", url = "@/docs/_index.md" },
]

# Mystic Cards, the lettering on Morrobroom's own logo, for titles. The manual is read, so its text
# stays in the system font.
font_override = "mystic-cards"
font_override_titles_only = true

# DreamWeave's own page-view counter: this is DreamWeave's site.
goatcounter = "dreamweave-mp"

# The hero draws the crescent and crate in 3D: static/js/morrobroom-hero.js, on three.js r180 in
# static/js/vendor/.
[extra.hero]
script = "js/morrobroom-hero.js"
preload = ["js/vendor/three.module.min.js", "js/vendor/three.core.min.js"]

# GitHub Discussions on this repository, through giscus. The ids are looked up at build time.
[extra.comments]
enabled = true
category = "General"
