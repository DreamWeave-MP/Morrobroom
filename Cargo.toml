[package]
name = "morrobroom"
version = "1.0.0"
edition = "2024"

[features]
default = ["serde"]
serde = []

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
delaunator = "1.1.0"
geo = { version = "0.33.1", default-features = false, features = ["earcut"] }
imagesize = "0.15.0"
mimalloc = "0.1.52"
nalgebra = "0.35.0"
nom = "8.0.0"
vfstool_lib = { version = "0.9.0", features = ["zip"] }
rayon = "1.12.0"
glam = "0.33.5"
lightmap = "0.7.0"
# rusty_dds 0.9.0's AVX2 BC7 path dereferences an insufficiently aligned
# static table; keep the safe scalar encoder until that upstream bug is fixed.
rusty_dds = { version = "0.9.0", default-features = false, features = ["encode"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
sha1 = "0.10.6"
usage = { version = "1.4.0", features = ["rayon"] }
openmw-config = "1.1.0"

[dependencies.tes3]
git = "https://github.com/Greatness7/tes3"
branch = "main"
features = ["esp", "nif"]
