{
	"profiles": [
		{
			"name": "Map-to-Engine",
			"tasks": [
				{
					"target": "build/${MAP_BASE_NAME}/${MAP_BASE_NAME}.omwaddon",
					"type": "delete"
				},
				{
					"enabled": true,
					"parameters": "compile --map \"${MAP_FULL_NAME}\" --scale 2.0 --output-dir \"build/${MAP_BASE_NAME}\" --output \"build/${MAP_BASE_NAME}/${MAP_BASE_NAME}.omwaddon\"",
					"tool": "${Morrobroom}",
					"treatNonZeroResultCodeAsError": true,
					"type": "tool"
				},
				{
					"enabled": true,
					"parameters": "--data \"${MAP_DIR_PATH}/build/${MAP_BASE_NAME}\" --content \"${MAP_BASE_NAME}.omwaddon\" --skip-menu --start \"${MAP_BASE_NAME}\"",
					"tool": "${OpenMW}",
					"treatNonZeroResultCodeAsError": false,
					"type": "tool"
				},
				{
					"enabled": false,
					"parameters": "${MAP_DIR_PATH}/build/${MAP_BASE_NAME}/${MAP_BASE_NAME}.omwaddon",
					"tool": "${OpenCS}",
					"treatNonZeroResultCodeAsError": false,
					"type": "tool"
				}
			],
			"workdir": "${MAP_DIR_PATH}"
		}
	],
	"version": 1
}
