{
	"profiles": [
		{
			"name": "Map-to-Engine",
			"tasks": [
				{
					"target": "build/${MAP_BASE_NAME}/${MAP_BASE_NAME}.omwaddon",
					"type": "delete"
				},
				{
					"parameters": "compile --map \"${MAP_FULL_NAME}\" --scale 1.0 --output-dir \"build/${MAP_BASE_NAME}\" --output \"build/${MAP_BASE_NAME}/${MAP_BASE_NAME}.omwaddon\"",
					"tool": "${Morrobroom}",
					"treatNonZeroResultCodeAsError": true,
					"type": "tool"
				},
				{
					"parameters": "--data=\"${MAP_DIR_PATH}/build/${MAP_BASE_NAME}\" --content=\"${MAP_BASE_NAME}.omwaddon\" --skip-menu=1 --start=\"${MAP_BASE_NAME}\"",
					"tool": "${OpenMW}",
					"type": "tool"
				},
				{
					"enabled": false,
					"parameters": "${MAP_DIR_PATH}/build/${MAP_BASE_NAME}/${MAP_BASE_NAME}.omwaddon",
					"tool": "${OpenCS}",
					"type": "tool"
				}
			],
			"workdir": "${MAP_DIR_PATH}"
		}
	],
	"version": 1
}
