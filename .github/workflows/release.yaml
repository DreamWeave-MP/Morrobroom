name: Morrobroom Manufacturing

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: main
    tags: ["*"]

jobs:
  build:
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: DreamWeave-MP/StroggForge/.github/workflows/rustGlobalBuild.yml@v41
    secrets: inherit
    with:
      # Required: JSON array of binary names to build. Add more for monorepos.
      binary_names: '["morrobroom"]'
      cargo_publish: false
      publish_docs: false
      enable_portmaster: true
      enable_android: true
