name: Morrobroom Manufacturing

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: main
    tags: ["*"]

jobs:
  build:
    permissions:
      actions: write
      contents: write
      pages: write
      id-token: write
    uses: DreamWeave-MP/StroggForge/.github/workflows/rustGlobalBuild.yml@v49
    secrets: inherit
    with:
      binary_names: '["morrobroom"]'
      include_files: "README.md,LICENSE,THIRD_PARTY.md,resources,content"
      cargo_publish: false
      # StroggForge records each release in content/home/mod.lock and deploys this site.
      mod_template: true
