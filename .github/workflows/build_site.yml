on:
  workflow_dispatch:
  push:
    tags: '*'
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

name: Build and deploy GH Pages
jobs:
  build-site:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Write Changelogs
        run: |
          ./buildSite --repository ${{ github.repository }} --changelog

      - name: Build Zola
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            ghcr.io/getzola/zola:v0.22.1 build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public/

  deploy:
    runs-on: ubuntu-latest
    needs: build-site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  release_cleanup:
    uses: DreamWeave-MP/StroggForge/.github/workflows/createRelease.yml@v40
    secrets: inherit

  build-mods:
    needs: release_cleanup
    runs-on: ubuntu-latest
    outputs:
      nexus-matrix: ${{ steps.nexus-matrix.outputs.matrix }}
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build Releases
        run: |
          RELEASE_NAME="${{ needs.release_cleanup.outputs.release_name }}"
          ARGS=(--repository "${{ github.repository }}" --build --changelog --release "$RELEASE_NAME")

          if [ "$RELEASE_NAME" != 'development' ]; then
            # Sensitive to multiple hyphens in tag name — use underscores in mod names instead
            ARGS+=(--tag "${RELEASE_NAME%%-*}")
          fi

          ./buildSite "${ARGS[@]}"

      - name: Set Nexus upload matrix
        id: nexus-matrix
        run: |
          manifests=(dist/*.modManifest)
          matrix=$(jq -c '[.mods[] | select(.nexus_group_id) | {slug, nexus_group_id, version, title}]' "${manifests[@]}")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Upload releases
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.release_cleanup.outputs.release_name }}
          prerelease: ${{ github.ref_type != 'tag' }}
          files: |
            dist/*.zip
            dist/*.modManifest

  nexus-upload:
    needs: build-mods
    if: github.ref_type == 'tag' && needs.build-mods.outputs.nexus-matrix != '' && needs.build-mods.outputs.nexus-matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mod: ${{ fromJson(needs.build-mods.outputs.nexus-matrix) }}
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Upload to NexusMods
        uses: Nexus-Mods/upload-action@main
        with:
          archive_existing_version: true
          primary_mod_manager_download: true
          api_key: ${{ secrets.NEXUS_API_KEY }}
          file_id: ${{ matrix.mod.nexus_group_id }}
          filename: dist/${{ matrix.mod.slug }}.zip
          version: ${{ matrix.mod.version }}
          display_name: ${{ matrix.mod.title }}
          update_mod_version: true
